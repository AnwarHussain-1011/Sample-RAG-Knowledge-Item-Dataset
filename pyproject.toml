[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdeskrag"
version = "0.1.0"
description = "Inspectable, evaluation-first RAG for IT support knowledge items"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
